<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Login - MS ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #cbd5e1;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
            border-color: #3b82f6;
            background-color: #fff;
        }
        .form-label {
            color: #334155 !important;
        }
    </style>
</head>
<body class="d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card glass-card border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center rounded-circle border border-3 mb-3 shadow-sm" style="width: 55px; height: 55px; border-color: #ff0000 !important; background-color: #ffffff;">
                                <span class="fw-bolder" style="color: #000000; font-size: 24px; letter-spacing: -1px;">MS</span>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Worker Login</h3>
                            <p class="text-muted">Access your ERP staff account</p>
                        </div>

                        <!-- EXPLICIT FORM ACTION ADDED HERE -->
                        <form method="POST" action="{% url 'worker_login' %}">
                            {% csrf_token %}
                            
                            {% if error %}
                            <div class="alert alert-danger py-2 small rounded-3 shadow-sm">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                            </div>
                            {% endif %}

                            <div class="mb-3">
                                <label class="form-label small fw-bold">Username</label>
                                <input type="text" name="username" class="form-control rounded-3" placeholder="Enter username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Password</label>
                                <input type="password" name="password" class="form-control rounded-3" placeholder="Enter password" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Login
                            </button>
                            
                            <div class="text-center">
                                <a href="{% url 'dashboard' %}" class="text-decoration-none text-secondary small hover-primary">
                                    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                                </a>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
