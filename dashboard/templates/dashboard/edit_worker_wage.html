<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Worker Wage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h4 class="fw-bold text-dark mb-3">Edit Wage: {{ worker.full_name }}</h4>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Daily Wage (Rs.)</label>
                    <input type="number" step="0.01" name="daily_wage" class="form-control" value="{{ worker.daily_wage }}" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Update Wage</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
