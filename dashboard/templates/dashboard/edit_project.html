<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <!-- Responsive Card Container -->
    <div class="w-full max-w-lg bg-white rounded-xl shadow-sm border border-gray-200 p-6 sm:p-8">
        
        <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-6">
            Edit Project: <span class="text-gray-600">{{ project.name }}</span>
        </h2>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-600 mb-2">Project Status</label>
                <select name="status" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white transition">
                    <option value="Ongoing" {% if project.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
                    <option value="Completed" {% if project.status == 'Completed' %}selected{% endif %}>Completed</option>
                    <option value="Not Started" {% if project.status == 'Not Started' %}selected{% endif %}>Not Started</option>
                    <option value="Pending" {% if project.status == 'Pending' %}selected{% endif %}>Pending</option>
                </select>
            </div>

            <!-- මෙතනයි වෙනස් වුණේ (name="added_income" දාලා දැනට තියෙන ගාණත් පෙන්නුවා) -->
            <div class="mb-8">
                <label class="block text-sm font-semibold text-gray-600 mb-2">Add New Income (Rs.)</label>
                <input type="number" step="0.01" name="added_income" placeholder="Enter amount to add" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 transition">
                <p class="text-emerald-600 font-bold text-sm mt-2">
                    <i class="fa-solid fa-wallet mr-1"></i> Current Total Income: Rs. {{ project.income|floatformat:2 }}
                </p>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-3">
                <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg transition duration-200">
                    Save Changes
                </button>
                <a href="{% url 'dashboard' %}" class="w-full sm:w-auto text-center bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-2.5 px-6 rounded-lg transition duration-200">
                    Cancel
                </a>
            </div>
        </form>
        
    </div>

</body>
</html>
