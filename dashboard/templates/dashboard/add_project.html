<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0 text-dark">Create New Project</h3>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left me-2"></i>Cancel
                </a>
            </div>

            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                <!-- Error Message Alert -->
                {% if error_msg %}
                <div class="alert alert-danger shadow-sm rounded-3 mb-4 d-flex align-items-center">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i> 
                    <div>{{ error_msg }}</div>
                </div>
                {% endif %}
                
                <form method="POST" action="{% url 'add_project' %}">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-medium small text-muted">Project Name</label>
                        <input type="text" name="name" class="form-control form-control-lg bg-light" required placeholder="e.g., Highway Bridge Construction">
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-medium small text-muted">Status</label>
                            <select name="status" class="form-select bg-light">
                                <option value="Pending">Pending</option>
                                <option value="Ongoing" selected>Ongoing</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-4 mt-md-0">
                            <label class="form-label fw-medium small text-muted">Deadline</label>
                            <input type="date" name="deadline" class="form-control bg-light" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-medium small text-muted">Expected Revenue (Target)</label>
                            <div class="input-group">
                                <span class="input-group-text border-0 bg-secondary text-white">Rs.</span>
                                <input type="number" step="0.01" name="expected_revenue" class="form-control bg-light" value="0.0">
                            </div>
                        </div>
                        <div class="col-md-6 mt-4 mt-md-0">
                            <label class="form-label fw-medium small text-muted">Actual Income (Received)</label>
                            <div class="input-group">
                                <span class="input-group-text border-0 bg-success text-white">Rs.</span>
                                <input type="number" step="0.01" name="income" class="form-control bg-light" value="0.0">
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 text-muted">
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill">
                        <i class="bi bi-save2 me-2"></i>Save Project
                    </button>
                </form>
            </div>
            
        </div>
    </div>
</div>

</body>
</html>
